<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel de Administración y Editor Visual | Creative Pro Remodeling LLC</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  
  <!-- Montserrat Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="admin.css">
  <script>
    // Prevent recursive embedding inside iframes
    if (window.self !== window.top) {
      window.top.location.href = window.self.location.href;
    }
  </script>
</head>
<body>

  <!-- ================= 1. PANTALLA DE INICIO DE SESIÓN ================= -->
  <div id="loginView" class="login-view">
    <div class="login-card">
      <img src="photos/logo_transparent.png" alt="Creative Pro Remodeling Logo" class="login-logo">
      <h1 class="login-title">Panel de <span class="gold-accent">Administración</span></h1>
      <p class="login-subtitle">Creative Pro Remodeling LLC &bull; Editor Visual del Sitio Web</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="adminPassword">Contraseña Maestra</label>
          <div class="password-input-wrap">
            <input type="password" id="adminPassword" class="admin-input" placeholder="Ingresa tu contraseña..." required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Mostrar u ocultar contraseña">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Iniciar Sesión en el Editor
        </button>

        <a href="index.html" class="btn-secondary-back" title="Regresar a la página principal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>Volver al Sitio Web</span>
        </a>

        <div id="loginError" class="login-error">
          Contraseña incorrecta. Por favor intenta de nuevo.
        </div>
      </form>
    </div>
  </div>

  <!-- ================= 2. EDITOR VISUAL DE PANTALLA COMPLETA ================= -->
  <div id="adminApp" class="admin-app">
    
    <!-- Barra Superior de Navegación -->
    <header class="admin-header">
      
      <!-- Fila Principal (Logo y Acciones) -->
      <div class="header-main-row">
        <div class="admin-brand">
          <img src="photos/logo_transparent.png" alt="Creative Pro Logo">
          <span class="admin-brand-text">CREATIVE <span class="gold">PRO</span> <span class="admin-brand-badge">EDITOR</span></span>
        </div>

        <!-- Sugerencia de Ayuda (Desktop) -->
        <div class="editor-hint">
          <span class="hint-dot"></span> Toca o haz clic en cualquier texto o foto para editarlo
        </div>

        <!-- Botones de Acción: Deshacer, Rehacer, Guardar, Sitio en Vivo, Salir -->
        <div class="header-actions">
          <button id="undoBtn" class="btn-history" title="Deshacer último cambio (Ctrl+Z)" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            <span>Deshacer</span>
          </button>
          
          <button id="redoBtn" class="btn-history" title="Rehacer cambio (Ctrl+Y)" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
            <span>Rehacer</span>
          </button>

          <button id="saveBtn" class="btn-save" title="Guardar cambios y publicar en vivo (Ctrl+S)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span>Guardar Cambios</span>
          </button>

          <a href="index.html" target="_blank" class="btn-icon" title="Ver Sitio Web Público (Nueva Pestaña)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>

          <button id="downloadBtn" class="btn-icon" title="Descargar copia de content.json">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>

          <button id="logoutBtn" class="btn-icon" title="Cerrar Sesión">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>

      <!-- Pestañas para Cambiar de Página -->
      <nav class="nav-tabs" id="pageTabs">
        <button class="tab-btn active" data-tab="home" data-page="index.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Inicio</span>
        </button>
        <button class="tab-btn" data-tab="about" data-page="about.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Sobre Nosotros</span>
        </button>
        <button class="tab-btn" data-tab="services" data-page="services.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <span>Servicios</span>
        </button>
        <button class="tab-btn" data-tab="portfolio" data-page="portfolio.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Galería de Proyectos</span>
        </button>
      </nav>

    </header>

    <!-- Contenedor del Sitio Web en Pantalla Completa -->
    <main class="admin-workspace-fullscreen">
      <iframe id="editorFrame" class="editor-frame" src="index.html"></iframe>
    </main>

  </div>

  <!-- Notificación Toast de Confirmación -->
  <div id="adminToast" class="admin-toast">
    <div class="toast-icon">✓</div>
    <div id="toastMessage">¡Cambios guardados y publicados en tu sitio web!</div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
